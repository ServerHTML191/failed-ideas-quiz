<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Failed Ideas // Netrunner Quiz</title>
<style>
:root{--yellow:#eff600;--cyan:#65f6eb;--pink:#ff4583;--muted:#a6acb5;--line:#393d45;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101115;color:#f6f6f2;font:16px/1.55 system-ui,sans-serif}header,footer,.row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}header,footer{padding:16px max(5vw,calc((100vw - 1080px)/2));border-bottom:1px solid var(--line)}header strong{font:900 17px monospace;letter-spacing:.05em}header strong b{color:var(--yellow)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.sound,.secondary{background:transparent;border:1px solid var(--line);color:#eee;padding:8px 16px}.sound,small,.tag,footer{font:13px/1.5 monospace;letter-spacing:.06em}main{max-width:1120px;margin:auto;padding:clamp(22px,4vw,55px) 20px}footer{border-top:1px solid var(--line);color:var(--muted);font-size:11px}.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--yellow);color:#111217;padding:clamp(24px,4vw,54px);clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%)}.hero canvas{position:absolute;right:0;top:0;width:47%;height:100%;z-index:-1}.hero h1{font:1000 clamp(64px,9vw,127px)/.83 system-ui,sans-serif;letter-spacing:-.085em;margin:25px 0;font-style:italic}.hero h1 span{display:block}.hero p{max-width:48%;margin:14px 0 24px}.primary{background:var(--yellow);color:#121318;border:0;padding:12px 22px;font-weight:800;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}.hero .primary{color:white;background:#17181d}.primary:disabled{opacity:.45;cursor:default}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel,details{background:#1a1c22;border:1px solid var(--line);padding:20px}.card{border-top:3px solid var(--accent)}.card small,.tag{color:var(--accent,var(--cyan))}h2{font-size:clamp(23px,3.5vw,39px);line-height:1.18;margin:18px 0}h3{margin:9px 0}.caption{font:700 13px monospace;letter-spacing:.1em;margin:28px 0 12px}.panel{max-width:840px;margin:auto;padding:clamp(20px,4vw,45px)}progress{width:100%;height:6px;accent-color:var(--yellow);margin:18px 0}.choices{display:grid;gap:10px;margin:24px 0}.choice{display:flex;align-items:center;gap:14px;background:#23262d;padding:13px;border:1px solid var(--line);cursor:pointer}.choice:has(:checked){border-color:var(--cyan);color:var(--cyan)}input[type=radio]{accent-color:var(--cyan)}input[type=text]{width:100%;background:#111318;border:1px solid #6a7079;padding:13px;margin:8px 0 26px;color:white}summary{cursor:pointer;font-weight:700}details{margin:10px 0}details p{overflow-wrap:anywhere;margin:10px 0}.good{color:var(--cyan)}.bad{color:var(--pink)}.result{font-size:46px;color:var(--yellow);font-weight:900}.muted{color:var(--muted)}[hidden]{display:none!important}@media(max-width:660px){.cards{grid-template-columns:1fr}.hero canvas{width:45%;height:52%;top:13%}.hero p{max-width:100%}.hero h1{font-size:clamp(50px,14vw,85px)}.hero .tag{font-size:11px}.card{padding:12px 16px}.panel .row{gap:9px}}
</style>
<header><strong><b>///</b> NETRUNNER ARCHIVE</strong><button class="sound" id="sound" aria-pressed="false">เสียง · ปิด</button></header>
<main><section id="home"><div class="hero"><canvas id="art" aria-hidden="true"></canvas><small>TECH HISTORY // QUIZ</small><h1>FAILED<span>IDEAS.</span></h1><p>เจาะแฟ้มสามอุปกรณ์ที่ไปไม่ถึงฝัน ผ่านคำถามภาษาอังกฤษ 20 ข้อ แล้วเปิดเฉลยท้ายเกม</p><button class="primary" id="start">เริ่มภารกิจ　↗</button></div><h2 class="caption">CASE FILES / แฟ้มคำถาม</h2><div class="cards" id="cards"></div></section>
<section class="panel" id="game" hidden><div class="row"><small class="tag" id="part"></small><small id="counter"></small></div><progress max="20" value="1" aria-label="ความคืบหน้า"></progress><p class="muted" id="kind"></p><h2 lang="en" id="question" tabindex="-1"></h2><form id="form"><div id="controls"></div><div class="row"><button class="secondary" type="button" id="prev">← ย้อนกลับ</button><button class="primary" id="next">ข้อต่อไป →</button></div></form></section>
<section class="panel" id="end" hidden><small class="tag">MISSION COMPLETE</small><h2 tabindex="-1" id="finishTitle">สรุปภารกิจและเฉลย</h2><div id="score" class="result" aria-live="polite"></div><p>ข้อ 1–4 ให้เทียบความหมายกับเฉลย แล้วเลือกผลเพื่อนับคะแนน</p><button class="secondary" id="expand">เปิดเฉลยทุกข้อ</button><div id="review"></div><button class="primary" id="restart">เล่นอีกครั้ง ↗</button></section></main><footer><span>NETRUNNER // TECH HISTORY</span><span>● LOCAL MODE</span></footer>
<script>
'use strict';
const cases=['Google Glass Failure','The Microsoft Zune Failure',"Nokia’s Gaming Disaster"];
const ranges=['01—08','09—12','13—20'];
const kinds=['Wh-Questions','Yes / No Questions','Multiple Choice Questions','Alternative Questions','Fill in the Blank'];
const rows=[
['When did Google launch Google Glass?','Google launched it in 2013.'],
['What is Google Glass?','It is a smart device that looks like glasses.'],
['What was Google Glass designed for?','It was designed to take photos, record videos, and access information.'],
['Why did Google Glass fail?','Because it was expensive and difficult to use.'],
['Could Google Glass take photos?','Yes, it could.',['Yes, it could.', "No, it couldn’t."]],
['Could Google Glass record videos?','Yes, it could.',['Yes, it could.', "No, it couldn’t."]],
['Was Google Glass expensive?','Yes, it was.',['Yes, it was.', "No, it wasn’t."]],
['Did Google Glass become popular?', "No, it didn't.",['Yes, it did.', "No, it didn't."]],
['When did Microsoft launch the Zune?','2006',['2003','2005','2006','2011']],
['Which product was the Zune designed to compete with?', "Apple\x27s iPod",['iPhone',"Apple\x27s iPod",'Nokia N-Gage','Samsung Galaxy']],
['What feature allowed users to share songs wirelessly?','Wi-Fi',['Bluetooth','Wi-Fi','Camera','GPS']],
['When did Microsoft discontinue the Zune?','2011',['2006','2008','2010','2011']],
['Was the Nokia N-Gage launched in 2003 or 2005?','It was launched in 2003.',['2003','2005'],0],
['Was the N-Gage a gaming smartphone or a laptop?','It was a gaming smartphone.',['A gaming smartphone','A laptop'],0],
['Did the N-Gage have a long or short battery life?','It had a short battery life.',['A long battery life','A short battery life'],1],
['Did Nokia stop production in 2003 or 2005?','Nokia stopped production in 2005.',['2003','2005'],1],
['Nokia launched the N-Gage gaming smartphone in ______.','2003'],
['The N-Gage had awkward ______ that made it hard to operate.','controls'],
['The Zune had limited compatibility with other ______.','devices'],
['Microsoft discontinued the Zune in ______.','2011']];
const $=id=>document.getElementById(id), elem=(tag,txt)=>Object.assign(document.createElement(tag),{textContent:txt});
cases.forEach((c,i)=>{const card=elem('article','');card.className='card';card.style.setProperty('--accent',['var(--cyan)','var(--pink)','var(--yellow)'][i]);card.append(elem('small','FILE 0'+(i+1)+' // Q'+ranges[i]),elem('h3',c));$('cards').append(card)});
let pos=0,answers=[],marks=[],enabled=false,audio;
function beep(){if(!enabled)return;try{audio??=new AudioContext();audio.resume().catch(()=>{});const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=660;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.08);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+.08)}catch{}}
$('sound').onclick=()=>{enabled=!enabled;$('sound').textContent='เสียง · '+(enabled?'เปิด':'ปิด');$('sound').setAttribute('aria-pressed',enabled);beep()};
function view(id){for(const name of ['home','game','end'])$(name).hidden=name!==id;window.scrollTo(0,0)}
function begin(){pos=0;answers=Array(20).fill('');marks=Array(4).fill(null);view('game');draw();beep()}
$('start').onclick=$('restart').onclick=begin;
function draw(){const [q,,choices]=rows[pos];$('part').textContent=cases[pos<8?0:pos<12?1:2];$('counter').textContent='Q '+String(pos+1).padStart(2,'0')+' / 20';document.querySelector('progress').value=pos+1;$('kind').textContent=kinds[Math.floor(pos/4)];$('question').textContent=q;$('controls').replaceChildren();$('prev').disabled=pos===0;$('next').textContent=pos===19?'จบเกมและดูเฉลย ↗':'ข้อต่อไป →';$('next').disabled=!answers[pos].trim();function save(v){answers[pos]=v;$('next').disabled=!v.trim()}
if(choices){const group=elem('div','');group.className='choices';group.setAttribute('role','radiogroup');group.setAttribute('aria-labelledby','question');choices.forEach((v,j)=>{const label=elem('label','');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='answer';input.checked=answers[pos]===v;input.onchange=()=>save(v);label.append(input,elem('span',(pos>=8&&pos<12?'ABCD'[j]+'. ':'')+v));group.append(label)});$('controls').append(group)}else{const input=document.createElement('input');input.type='text';input.autocomplete='off';input.maxLength=600;input.value=answers[pos];input.placeholder=pos<4?'พิมพ์คำตอบภาษาอังกฤษ':'พิมพ์คำที่หายไป';input.setAttribute('aria-labelledby','question');input.oninput=()=>save(input.value);$('controls').append(input)}$('question').focus()}
$('prev').onclick=()=>{if(pos>0){pos--;draw()}};
$('form').onsubmit=e=>{e.preventDefault();if(!answers[pos].trim())return;beep();if(pos===19)finish();else{pos++;draw()}};
const norm=s=>s.trim().toLowerCase().replace(/[.!?]+$/,'').trim();
function correct(i){const [,key,choices,idx]=rows[i];return norm(answers[i])===norm(idx===undefined?key:choices[idx])}
function tally(){const pending=marks.filter(v=>v===null).length;const sum=rows.slice(4).filter((_,i)=>correct(i+4)).length+marks.filter(v=>v===true).length;$('score').textContent=sum+' / 20'+(pending?' · รอตรวจ '+pending+' ข้อ':'')}
function finish(){view('end');$('finishTitle').focus();$('review').replaceChildren();$('expand').textContent='เปิดเฉลยทุกข้อ';rows.forEach(([q,key,choices],i)=>{const box=elem('details',''),head=elem('summary','');const setTitle=()=>{const v=i<4?marks[i]:correct(i);head.textContent=(i+1)+'. '+q+'　'+(v===null?'รอตรวจ':v?'✓ ถูก':'× ผิด');head.className=v===null?'':v?'good':'bad'};setTitle();box.open=i<4;box.append(head,elem('p','คำตอบของคุณ　'+answers[i]),elem('p','เฉลย　'+(i>=8&&i<12?'ABCD'[choices.indexOf(key)]+'. ':'')+key));if(i<4){const wrap=elem('div','');wrap.className='row';[true,false].forEach(v=>{const btn=elem('button',v?'ความหมายตรงกัน':'ยังไม่ตรง');btn.className='secondary';btn.onclick=()=>{marks[i]=v;setTitle();tally()};wrap.append(btn)});box.append(wrap)}$('review').append(box)});tally()}
$('expand').onclick=()=>{const boxes=[...$('review').children],open=boxes.some(el=>!el.open);boxes.forEach(b=>b.open=open);$('expand').textContent=open?'พับเฉลยทุกข้อ':'เปิดเฉลยทุกข้อ'};
$('review').addEventListener('toggle',()=>{$('expand').textContent=[...$('review').children].every(b=>b.open)?'พับเฉลยทุกข้อ':'เปิดเฉลยทุกข้อ'},true);
// Draw a wearable-display schematic locally at the screen's native resolution.
function artwork(){const c=$('art'),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;const d=devicePixelRatio;c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);g.fillStyle='#10111524';for(let x=0;x<w;x+=9)for(let y=0;y<h;y+=9)g.fillRect(x,y,1.3,1.3);const scale=Math.min(w/460,h/310);g.translate(w/2,h/2);g.scale(scale,scale);g.transform(1,-.15,.13,1,0,0);function shape(points,fill,stroke='#191b20',line=4){g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.lineWidth=line;g.stroke()}shape([[-166,-42],[-119,-99],[-71,-104],[-70,-92],[-108,-84],[-145,-29]],'#31343b');shape([[69,-40],[139,-99],[187,-93],[190,-79],[149,-82],[94,-22]],'#22252a');shape([[-167,-41],[-85,-29],[-10,-13],[20,-17],[95,-37],[84,17],[51,46],[15,49],[-6,33],[-14,8],[-29,9],[-42,33],[-77,42],[-123,32],[-151,7]],'#b6c986');shape([[-170,-47],[-83,-36],[-17,-21],[21,-25],[91,-47],[96,-31],[22,-9],[-16,-5],[-87,-21],[-166,-32]],'#202228');shape([[32,-35],[83,-50],[126,-46],[113,-19],[59,-8],[30,-13]],'#343840');shape([[29,-31],[58,-28],[54,-10],[25,-13]],'#68f8e9');g.fillStyle='#26282a';g.font='bold 12px monospace';g.fillText('FIG. 01  /  GLASS',-151,93);g.fillRect(-151,103,87,2)}
new ResizeObserver(artwork).observe($('art'));
</script></html>
